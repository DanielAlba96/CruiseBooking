apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: statestore
spec:
  type: state.postgresql
  version: v2
  metadata:
    - name: connectionString
      secretKeyRef:
        name: POSTGRES_CONNECTION_STRING
        key: POSTGRES_CONNECTION_STRING
    - name: actorStateStore
      value: "true"
auth:
  secretStore: kubernetes

---

apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: cachestore
spec:
  type: state.redis
  version: v1
  metadata:
    - name: redisHost
      secretKeyRef:
        name: REDIS_HOST
        key: REDIS_HOST
    - name: redisPassword 
      secretKeyRef:
        name: REDIS_PASSWORD
        key: REDIS_PASSWORD
auth:
  secretStore: kubernetes
