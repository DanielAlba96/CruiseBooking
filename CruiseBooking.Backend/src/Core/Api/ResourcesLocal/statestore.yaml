apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: statestore
spec:
  type: state.postgresql
  version: v2
  metadata:
    - name: connectionString
      secretKeyRef:
        name: POSTGRES_CONNECTION_STRING
        key: POSTGRES_CONNECTION_STRING
    - name: actorStateStore
      value: "true"
auth:
  secretStore: envvar-secret-store
